[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvulnscanner"
version = "0.1.0"
description = "A safe, CLI-based framework for authorized web vulnerability assessments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "WebVulnScanner contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1",
    "Jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "tldextract>=5.1,<6",
]

[project.scripts]
webvulnscanner = "webvulnscanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["webvulnscanner*"]

[tool.setuptools.package-data]
webvulnscanner = [
    "config/*.yaml",
    "config/profiles/*.yaml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise multiple components or external process boundaries",
]
