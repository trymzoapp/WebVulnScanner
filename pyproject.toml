[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvulnscanner"
version = "0.1.0"
description = "A safe, CLI-based framework for authorized web vulnerability assessments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "WebVulnScanner contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1",
    "Jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "tldextract>=5.1,<6",
]

[project.scripts]
webvulnscanner = "webvulnscanner.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["webvulnscanner*"]

[tool.setuptools.package-data]
webvulnscanner = [
    "config/*.yaml",
    "config/profiles/*.yaml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise multiple components or external process boundaries",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "tldextract.*",
]
ignore_missing_imports = true

